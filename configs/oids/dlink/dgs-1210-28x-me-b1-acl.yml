# DGS-1210-28X/ME/B1 ACL OIDs.
# This model key shares dgs-1210-28xs-me-b1.yml with two other, physically
# different products (DGS-1210-28XS/ME and DGS-1210-28/ME/B2), each of which
# uses its own private OID branch for ACL - so those OIDs can't live in the
# shared file without breaking one of the siblings. Kept in a separate file
# instead, containing only the ACL names, included last so nothing else is
# affected.
# AclProfileIpList/Ports weren't in the sourced OID list for this exact
# model, but confirmed live by direct SNMP walk (same .8/.51 suffix pattern
# as every other DGS-1210 ME variant).
- { name: acl.v4.ipList, oid: .1.3.6.1.4.1.171.10.76.43.1.15.3.1.1.8}
- { name: acl.v4.ports, oid: .1.3.6.1.4.1.171.10.76.43.1.15.3.1.1.51}
- { name: acl.v6.action, oid: .1.3.6.1.4.1.171.10.76.43.1.15.2.1.1.11, values: {1: permit, 2: deny}}
- { name: acl.v6.ports, oid: .1.3.6.1.4.1.171.10.76.43.1.15.2.1.1.51}
