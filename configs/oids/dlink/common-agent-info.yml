# swDHCPRelayMIB (dlink-common-mgmt.42) - global toggles for the two mutually
# exclusive DHCP forwarding modes these switches run in production. Neither one
# keeps its own client-binding table (verified against the vendor MIB) - the
# swIpMacBindingDHCPSnoopTable above is the only one - but which of these two is
# enabled tells us whether this switch is even in the DHCP path at all.
- { name: dhcpRelay.state, oid: .1.3.6.1.4.1.171.12.42.1.1}
- { name: dhcpRelay.localState, oid: .1.3.6.1.4.1.171.12.42.4.1}

