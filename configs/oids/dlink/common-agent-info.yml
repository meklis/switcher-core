# swIpMacBindMIB (dlink-common-mgmt.23) - IP-MAC-Port Binding / DHCP snooping.
# Only present on "managed" tier switches (DES-3200/30xx, DGS-3000/3100/3120/3420);
# not present on the web-smart "ME" line (DGS-1100/1210-ME) - confirmed by live probing.
